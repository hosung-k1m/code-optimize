_ > nanoagent.plugin.v0001.ManifestConfig:
id: code-optimize
name: Code Optimize
version: 0.4.1
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: [pypi.org, files.pythonhosted.org, registry.npmjs.org, index.crates.io, static.crates.io, proxy.golang.org, sum.golang.org, github.com, codeload.github.com, release-assets.githubusercontent.com]
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]

tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  list_problems:
    description: Discover exact problem references before choosing one
  describe_problem:
    description: Read the problem, C++ baseline, WASI resource limits, bundled build tools and benchmark settings
  evaluate_code:
    description: Compile a project to WASI, execute it with fixed memory and instruction limits, and return measured correctness and timing

tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  list-problems:
    description: &list_instructions >-
      Call this first to list exact bundled and workspace problem references. The default
      challenge is origin bundled, directory repeated-shortest-paths. Never guess directories.
    runner: tool
    tools: [list_problems]
    reference: null
    instructions: *list_instructions
  describe-problem:
    description: &describe_instructions >-
      Describe a listed problem and show its exact current WASI resource limits and
      benchmark policy before coding. Default origin bundled, directory repeated-shortest-paths.
      Execution uses one WASI thread, 2147483648 bytes of linear memory and 30000000000
      instruction fuel units per trial. Build tools and Wasmtime ship in the plugin;
      Docker and desktop changes are unnecessary. Candidates must compile to WASIp1.
    runner: tool
    tools: [describe_problem]
    reference: null
    instructions: *describe_instructions
  evaluate-code:
    description: &evaluate_instructions >-
      Actually build and benchmark the candidate; do not stop at printing source.
      Submit UTF-8 project.files, project.prepare argv arrays and project.run beginning
      with a relative .wasm path followed by {input_dir} and {output_path}. For C++ use
      [python3, -m, ziglang, c++, -target, wasm32-wasi, -fno-exceptions, -O2, -std=c++17,
      main.cpp, -o, main.wasm] then run [./main.wasm, '{input_dir}', '{output_path}'].
      Use standard headers. Other languages need a compiler or interpreter producing
      WASIp1; native executables and plain Python/JavaScript cannot be run as candidates.
      Include dependency manifests and lockfiles; use uv for Python build dependencies.
      Compilation and dependency preparation run before measurement. After any compiler
      error, fix the project and call evaluate-code again. Continue until a complete
      measured report is returned or report the actual blocking error. Never replace
      execution with corrected source, a Makefile, confidence or theoretical speedup.
      Summarize only the returned verdict and measured baseline/candidate times and speedup.
    runner: tool
    tools: [evaluate_code]
    reference: null
    instructions: *evaluate_instructions

  optimize-code:
    description: >-
      Implement and benchmark a faster C++17 solution for a listed problem. Call this
      task when the user asks to implement or optimize code. Its agent describes the
      problem, creates and evaluates the candidate, fixes compiler errors, and submits
      the saved report reference. NanoAgent automatically verifies the submitted result.
    runner: agent
    tools: [describe_problem, evaluate_code]
    reference: null
    instructions: |-
      Call describe_problem for the input problem. Read its prompt, baseline, interface,
      resource limits and benchmark policy, then implement a faster C++17 solution.
      Call evaluate_code with problem equal to the task input problem and a project
      containing complete UTF-8 files, preparation argv arrays, and the run argv.
      For C++ use [python3, -m, ziglang, c++, -target, wasm32-wasi, -fno-exceptions,
      -O2, -std=c++17, main.cpp, -o, main.wasm] and run
      [./main.wasm, '{input_dir}', '{output_path}']. Use standard headers.
      Fix compilation errors and call evaluate_code again. Do not submit source code,
      estimated timings, or an invented report. Once evaluate_code returns a complete
      measured report, call submit with problem, assessment_id and report_path copied
      exactly from that result. Do not rewrite the report or its artifacts.
      End after submission. NanoAgent automatically verifies the saved report and shows
      the measured timings and deterministic verdict, including a failed verdict.

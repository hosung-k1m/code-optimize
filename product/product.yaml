  "List the problems, then use optimize-code for bundled repeated-shortest-paths. Implement a faster C++17 solution and submit its source files and build/run commands. Let NanoAgent automatically compile, benchmark, and verify the submission. Show baseline vs optimized times, output matches and speedups for every case, and the deterministic verdict."
highlights:
  - Naive C++ baseline and optimized WASI modules run under identical enforced limits
  - Embedded compiler and runtime; no Docker, VM or external compiler installation
  - Exact output bytes, measured median times and deterministic acceptance
  - Typed candidate submission starts automatic compilation, benchmarking and verification
steps:

tagline: Beat a naive C++ graph solver inside a fixed WASI sandbox
summary: |-
  Optimize code and compare it with the baseline using measured elapsed times, exact output checks and a deterministic verdict.

  Copy this prompt to begin:
  "List the problems and describe bundled repeated-shortest-paths. Use optimize-code to implement and benchmark a faster C++17 solution, then submit its measured report for automatic verification. Fix build errors and retry until you have a complete measured report. Compare baseline vs optimized times, output matches and speedups for every case, and show the deterministic verdict. Do not stop after describing the problem or printing code; finish with the submitted report and deterministic verdict."
highlights:
  - Naive C++ baseline and optimized WASI modules run under identical enforced limits
  - Embedded compiler and runtime; no Docker, VM or desktop modification
  - Exact output bytes, measured median times and deterministic acceptance
  - Compiler errors lead to revision and another measured evaluation
steps:
  - Ask the agent to discover and describe the graph problem and current sandbox limits
  - Use optimize-code to implement, compile and benchmark a candidate
  - The agent submits the measured report reference; NanoAgent verifies it automatically

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoagent-code-optimize"
version = "0.3.1"
description = "Benchmark WASI projects with fixed limits against naive C++ baselines"
requires-python = ">=3.12"
dependencies = ["mcp>=1.27,<2", "slimconfig", "anyio>=4.5,<5", "omegaconf>=2.3,<3", "PyYAML>=6,<7", "wasmtime==50.0.1", "ziglang==0.14.1"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
plugin = ["problems/**/*"]

[tool.uv.sources]
slimconfig = { git = "https://github.com/zeyuyang8/slimconfig", branch = "master" }

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
pythonpath = ["."]
